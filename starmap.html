<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>星图 · 关系展示原型</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --cyan:#5cf2ff; --amber:#ffb547; --ink:#dff6ff; --mute:#7f9bb3;
  --panel:rgba(6,14,30,.62); --line:rgba(92,242,255,.22); --line2:rgba(92,242,255,.45);
  --cn:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;
  --mono:"Share Tech Mono",ui-monospace,monospace;
  --disp:"Orbitron","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#01030b;color:var(--ink);font-family:var(--cn)}
canvas{position:fixed;inset:0;display:block;cursor:grab}
canvas.drag{cursor:grabbing}
canvas.pointer{cursor:pointer}
button{font:inherit;color:inherit}

.panel{position:fixed;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-radius:4px;box-shadow:0 0 0 1px rgba(0,0,0,.4),0 0 30px rgba(92,242,255,.06) inset}
.panel::before,.panel::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--cyan);opacity:.8;pointer-events:none}
.panel::before{top:-2px;left:-2px;border-right:none;border-bottom:none}
.panel::after{bottom:-2px;right:-2px;border-left:none;border-top:none}
.lbl{font-family:var(--disp);font-size:10px;letter-spacing:.22em;color:var(--cyan);opacity:.85}

.brand{position:fixed;top:18px;left:20px;display:flex;align-items:baseline;gap:10px;cursor:pointer;user-select:none}
.brand:hover b{color:var(--cyan);text-shadow:0 0 24px rgba(92,242,255,1)}
.brand:hover span{color:var(--ink)}
.brand b{font-family:var(--disp);font-weight:900;font-size:22px;letter-spacing:.28em;color:#fff;text-shadow:0 0 18px rgba(92,242,255,.8)}
.brand span{font-size:13px;color:var(--mute);letter-spacing:.3em}
#domains{position:fixed;top:56px;left:20px;display:flex;gap:6px}
#domains button{background:rgba(6,14,30,.55);border:1px solid var(--line);padding:6px 12px 6px 10px;cursor:pointer;border-radius:3px;
  display:flex;flex-direction:column;align-items:flex-start;min-width:76px;transition:.2s}
#domains button small{font-family:var(--disp);font-size:8.5px;letter-spacing:.2em;color:var(--mute)}
#domains button span{font-size:13px}
#domains button:hover{border-color:var(--line2)}
#domains button.on{border-color:var(--cyan);background:rgba(92,242,255,.12);box-shadow:0 0 16px rgba(92,242,255,.25)}
#domains button.on small{color:var(--cyan)}

.hud{top:18px;left:50%;transform:translateX(-50%);display:flex;align-items:stretch;padding:0}
.hud>div{padding:10px 18px;display:flex;flex-direction:column;justify-content:center;gap:3px}
.hud>div+div{border-left:1px solid var(--line)}
.hud-focus b{font-size:18px;letter-spacing:.04em;text-shadow:0 0 12px rgba(92,242,255,.6);white-space:nowrap}
.hud-focus small{font-size:11px;color:var(--mute);white-space:nowrap}
.hud-focus small a{color:var(--ink);cursor:pointer;border-bottom:1px dashed rgba(92,242,255,.45)}
.hud-focus small a:hover{color:var(--cyan)}
.rctl{display:flex;align-items:center;gap:8px}
.rctl button{width:24px;height:24px;border:1px solid var(--line2);background:transparent;cursor:pointer;border-radius:2px;line-height:1}
.rctl button:hover{background:rgba(92,242,255,.15)}
#rDots{display:flex;gap:4px}
#rDots i{width:18px;height:10px;border:1px solid var(--line2);cursor:pointer;transform:skewX(-20deg);transition:.2s}
#rDots i.on{background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
#rNum{font-family:var(--disp);font-size:18px;color:#fff;min-width:16px;text-align:center}
.hud-stats{font-family:var(--mono);font-size:12px;color:var(--mute);white-space:nowrap}
.hud-stats em{font-style:normal;color:var(--ink)}

.left{top:118px;left:20px;width:250px;max-height:calc(100vh - 380px);display:flex;flex-direction:column;padding:12px}
.search{position:relative;margin:6px 0 10px}
.search input{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--ink);padding:8px 10px 8px 30px;font:13px var(--cn);border-radius:2px;outline:none}
.search input:focus{border-color:var(--cyan);box-shadow:0 0 12px rgba(92,242,255,.25)}
.search::before{content:"⌕";position:absolute;left:10px;top:6px;color:var(--cyan);font-size:16px}
#results{overflow:auto;margin-bottom:6px}
.list{overflow:auto;flex:1;min-height:60px}
.item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:2px;cursor:pointer;font-size:13px;border:1px solid transparent}
.item:hover{background:rgba(92,242,255,.08);border-color:var(--line)}
.item.on{background:rgba(92,242,255,.12);border-color:var(--line2)}
.item .dot{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor;background:currentColor}
.item .dot.attr{width:5px;height:5px;margin:0 2px}
.item .meta{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--mute);white-space:nowrap}
.item .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.right{top:118px;right:20px;width:310px;max-height:calc(100vh - 140px);overflow:auto;padding:16px 16px 18px}
.right h2{margin:6px 0 4px;font-size:22px;font-weight:600;letter-spacing:.02em}
.kick{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag{font-size:10.5px;padding:2px 7px;border:1px solid currentColor;border-radius:2px;letter-spacing:.06em}
.desc{color:#b8cbe0;font-size:13px;line-height:1.6;margin:6px 0 12px}
.fn{font-size:14px;color:#eaf6ff;line-height:1.55;margin:10px 0 4px;padding:6px 10px;border-left:2px solid var(--cyan);background:rgba(92,242,255,.07)}
.fn::before{content:"功能";font-family:var(--mono);font-size:10px;letter-spacing:.15em;color:var(--cyan);margin-right:8px}
#tip .t4{color:#eaf6ff;margin-top:4px}
.kv{display:grid;grid-template-columns:72px 1fr;gap:4px 10px;font-size:12.5px;margin-bottom:12px}
.kv span{color:var(--mute)}
.kv a,.lnk{color:var(--ink);cursor:pointer;text-decoration:none;border-bottom:1px dashed rgba(92,242,255,.4)}
.kv a:hover,.lnk:hover{color:var(--cyan)}
.btn{display:inline-flex;align-items:center;gap:6px;background:rgba(92,242,255,.1);border:1px solid var(--cyan);color:var(--cyan);padding:7px 14px;cursor:pointer;
  font-family:var(--disp);font-size:11px;letter-spacing:.18em;border-radius:2px;margin-bottom:6px}
.btn:hover{background:rgba(92,242,255,.22);box-shadow:0 0 14px rgba(92,242,255,.35)}
.btn[disabled]{opacity:.4;cursor:default;box-shadow:none}
.sec{margin-top:14px}
.sec h3{margin:0 0 6px;font-family:var(--disp);font-weight:500;font-size:10px;letter-spacing:.22em;color:var(--cyan);display:flex;justify-content:space-between;
  border-bottom:1px solid var(--line);padding-bottom:4px}
.row{font-size:12.5px;padding:5px 2px;line-height:1.55;border-bottom:1px dashed rgba(92,242,255,.08)}
.rel{font-family:var(--mono);font-size:11px;padding:0 6px;border-radius:2px;margin:0 3px;white-space:nowrap}
.via{color:var(--mute);font-size:11px}
.note{font-size:11.5px;color:var(--mute);line-height:1.6;border-left:2px solid var(--amber);padding:6px 9px;background:rgba(255,181,71,.06);margin-top:12px}
.empty{color:var(--mute);font-size:12px;padding:4px 2px}

.legend{left:20px;bottom:20px;width:250px;padding:12px 14px;font-size:12px}
.legend .lg{display:flex;align-items:center;gap:10px;margin:5px 0;color:#c6d6e6}
.legend svg{flex:none}
.legend .grp{margin-top:10px}

.tools{right:20px;bottom:20px;display:flex;gap:2px;padding:4px}
.tools button{background:transparent;border:1px solid transparent;padding:6px 10px;font-size:12px;cursor:pointer;color:var(--mute);border-radius:2px;white-space:nowrap}
.tools button.on{color:var(--cyan);border-color:var(--line)}
.tools button:hover{color:var(--ink)}
.tools button.acc{color:var(--amber);border-color:rgba(255,181,71,.4)}
.hint{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:11px;color:rgba(127,155,179,.75);letter-spacing:.06em;pointer-events:none;white-space:nowrap}

#tip{position:fixed;pointer-events:none;background:rgba(4,10,22,.92);border:1px solid var(--line2);padding:8px 10px;font-size:12px;max-width:260px;
  border-radius:3px;opacity:0;transition:opacity .12s;z-index:9}
#tip b{font-size:13px}
#tip .t2{color:var(--mute);font-size:11px;margin-top:2px}
#tip .t3{color:#b8cbe0;margin-top:4px;line-height:1.5}

.scan{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px);mix-blend-mode:overlay}
.vign{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.6))}
/* 面板收起 / 沉浸模式 */
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px}
.right .ph{margin-bottom:6px}.legend .ph{margin-bottom:2px}
.pbtn{flex:none;width:20px;height:20px;padding:0;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--cyan);cursor:pointer;border-radius:2px;font:12px/18px var(--mono)}
.pbtn:hover{border-color:var(--cyan);background:rgba(92,242,255,.15)}
.panel.collapsed>:not(.ph):not(.hud-focus):not(.hud-btn){display:none!important}
.panel.collapsed{width:auto!important;max-height:none!important;padding:8px 10px!important;overflow:visible!important}
.hud.collapsed{padding:0!important}
.hud.collapsed .hud-focus{padding:6px 12px}
.hud.collapsed #hudSub{display:none}
.hud-btn{justify-content:flex-start!important;padding:10px 10px!important}
.brand,#domains,.panel,.hint{transition:opacity .45s}
body.immersive .brand,body.immersive #domains,body.immersive .panel,body.immersive .hint,body.immersive .views{opacity:0;pointer-events:none}
#immBack{position:fixed;top:14px;left:16px;z-index:8;opacity:0;pointer-events:none;transition:opacity .45s;background:rgba(6,14,30,.5);
  border:1px solid var(--line);color:var(--ink);padding:6px 12px;border-radius:3px;cursor:pointer;font-size:12px}
body.immersive #immBack.can{opacity:.35;pointer-events:auto}
body.immersive #immBack:hover{opacity:1;border-color:var(--cyan)}
#immCap a{color:rgba(220,240,255,.8);cursor:pointer;border-bottom:1px dashed rgba(92,242,255,.4);pointer-events:auto}
#immCap a:hover{color:var(--cyan)}
body:not(.immersive) #immCap a{pointer-events:none}
.views{position:fixed;top:18px;right:20px;display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden;background:rgba(6,14,30,.6);transition:opacity .45s;z-index:5}
.views a{padding:7px 14px;font-size:12px;color:var(--mute);text-decoration:none;letter-spacing:.1em;display:flex;gap:6px;align-items:center}
.views a.on{color:var(--cyan);background:rgba(92,242,255,.12)}
.views a:not(.on):hover{color:var(--ink);background:rgba(92,242,255,.06)}
a.btn{text-decoration:none}
.btn.ghost{background:transparent;border-color:var(--line2);color:var(--ink);margin-left:6px}
.btn.ghost:hover{border-color:var(--cyan);color:var(--cyan)}
#syncToast{position:fixed;left:50%;top:96px;transform:translateX(-50%);z-index:9;display:none;background:rgba(4,10,22,.94);border:1px solid var(--amber);
  color:var(--ink);padding:8px 14px;border-radius:3px;font-size:12.5px;box-shadow:0 0 20px rgba(255,181,71,.25)}
#syncToast button{margin-left:10px;background:transparent;border:1px solid var(--amber);color:var(--amber);padding:3px 10px;border-radius:2px;cursor:pointer}
@media (max-width:1380px){.views a{padding:6px 10px}}
body.immersive .vign{background:radial-gradient(ellipse at center,transparent 62%,rgba(0,0,0,.45))}
#immExit{position:fixed;top:14px;right:16px;z-index:8;opacity:0;pointer-events:none;transition:opacity .45s;background:rgba(6,14,30,.5);
  border:1px solid var(--line);color:var(--ink);padding:6px 12px;border-radius:3px;cursor:pointer;font-size:12px}
body.immersive #immExit{opacity:.3;pointer-events:auto}
body.immersive #immExit:hover{opacity:1;border-color:var(--cyan)}
#immCap{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);font:12px var(--mono);letter-spacing:.2em;color:rgba(220,240,255,.5);
  opacity:0;pointer-events:none;transition:opacity .6s;white-space:nowrap}
body.immersive #immCap{opacity:1}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:rgba(92,242,255,.25);border-radius:3px}

@media (max-width:1380px){ .hud{left:300px;transform:none} .hud-stats{display:none!important}
  #domains button{min-width:0;padding:5px 9px} #domains button small{font-size:7.5px;letter-spacing:.1em} }
@media (max-width:1180px){ .left{width:210px} .legend{width:210px} .right{width:270px} .hint{display:none} .hud{left:290px} .hud>div{padding:8px 12px} }
@media (max-width:860px){
  .left,.legend,.hint{display:none}
  .hud{top:104px;left:16px;right:16px;transform:none;flex-wrap:wrap}
  #domains{left:16px;right:16px;overflow-x:auto}
  .brand{left:16px}
  .right{top:auto;bottom:64px;left:16px;right:16px;width:auto;max-height:38vh}
  .tools{left:16px;right:16px;justify-content:center;flex-wrap:wrap}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="vign"></div>
<div class="scan"></div>

<div class="brand" title="进入顶级总览"><b>STARMAP</b><span>星图 · 关系展示</span></div>
<nav id="domains"></nav>

<div class="hud panel" id="hud">
  <div class="hud-focus">
    <span class="lbl" id="hudLbl">FOCUS · 焦点</span>
    <b id="hudName">—</b>
    <small id="hudSub"></small>
  </div>
  <div id="hudRange">
    <span class="lbl">RANGE · 展示范围</span>
    <div class="rctl">
      <button id="rMinus" title="缩小范围 ( - )">−</button>
      <div id="rDots"></div>
      <button id="rPlus" title="扩大范围 ( + )">＋</button>
      <span id="rNum">1</span>
    </div>
  </div>
  <div class="hud-stats" id="hudStats"></div>
  <div class="hud-btn"><button class="pbtn" data-panel="hud">—</button></div>
</div>

<aside class="left panel" id="left">
  <div class="ph"><span class="lbl">SEARCH · 搜索要素</span><button class="pbtn" data-panel="left">—</button></div>
  <div class="search"><input id="q" placeholder="名称、属性…" autocomplete="off"></div>
  <div id="results"></div>
  <span class="lbl" style="margin-top:4px" id="listLbl">GALAXIES · 星系</span>
  <div class="list" id="galaxies" style="margin-top:6px"></div>
</aside>

<aside class="right panel" id="rightP">
  <div class="ph"><span class="lbl">INFO · 信息</span><button class="pbtn" data-panel="rightP">—</button></div>
  <div id="detail"></div>
</aside>
<div class="legend panel" id="legendP">
  <div class="ph"><span class="lbl">LEGEND · 图例</span><button class="pbtn" data-panel="legendP">—</button></div>
  <div id="legend"></div>
</div>

<div class="tools panel">
  <button id="toOverview" class="acc">◂ 星团总览</button>
  <button data-opt="attrLabels" class="on">属性标签</button>
  <button data-opt="relLabels" class="on">关系标签</button>
  <button data-opt="fnLabels" class="on" title="在星体下方显示功能简述">功能文字</button>
  <button data-opt="flow" class="on">流动</button>
  <button data-opt="spin" class="on">自转</button>
  <button id="recenter">⌖ 重置视角</button>
  <button id="immBtn" title="隐藏全部面板（H）">⛶ 沉浸</button>
</div>
<div class="hint" id="hint"></div>
<button id="immExit" title="退出沉浸（H）">⛶ 退出沉浸 · H</button>
<button id="immBack" title="返回上一层（Esc）">◂ 上一层 · Esc</button>
<nav class="views"><a class="on" title="当前：星图">◉ 星图</a><a id="toManage" href="manage.html" title="到管理台（保留当前星域与选中对象）">▤ 管理</a></nav>
<div id="syncToast">管理台修改了数据<button id="syncReload">刷新星图</button></div>
<div id="immCap"></div>
<div id="tip"></div>

<script src="data.js?v=2026-11-02e"></script>
<script src="storage.js?v=2026-11-02b"></script>
<script>
(async()=>{
await MyNet.ready;
const DOMAINS=MyNet.load();   // 数据来自共享数据层 data.js（管理台修改后这里同步）

const PALETTE=MyNet.PALETTE;   // 与管理台一致
const GAP=250, MAXR=5, PITCH0=.95, FL=1700;
const FONT='"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif';
const MONO='"Share Tech Mono",ui-monospace,monospace';
const $=s=>document.querySelector(s);
const rgb=hex=>{const n=parseInt(hex.slice(1),16);return [n>>16&255,n>>8&255,n&255]};
const rgba=(hex,a)=>`rgba(${rgb(hex)},${a})`;
const mix=(hex,t,to=[255,255,255])=>rgb(hex).map((v,i)=>Math.round(v+(to[i]-v)*t));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hash=s=>{let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return (h>>>0)/4294967296};
const gauss=()=>(Math.random()+Math.random()+Math.random()-1.5)/1.5;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const clip=(s,n)=>s&&s.length>n?s.slice(0,n-1)+'…':(s||'');

/* ============================================================ 状态 */
const S={dk:'res',mode:'overview',focus:null,range:1,sel:null,hover:null,
  opts:{attrLabels:true,relLabels:true,flow:true,spin:true,fnLabels:true}};
let D,els,rels,gColor,GAL=new Map(),cross=[];
const sim=new Map();           // nodeId -> {x,y,h,vx,vy,a,ta,dist,ph}
let view={vis:new Set(),dist:new Map(),subs:[],rels:[],boundary:new Map()};
const cam={x:0,y:0,z:.6,yaw:.5,pitch:PITCH0,tx:0,ty:0,tz:.6,tyaw:.5,tpitch:PITCH0,uz:1};
let follow=true,warp=0,T=0,trans=null,hits=[];
let VX=0,VY=24,tVX=0,tVY=24;   // 画面中心相对窗口中心的偏移（避开展开的面板）

const get=id=>els.get(id);
const ownerId=id=>{const e=get(id);return e.state==='attr'?e.parent:e.id};
const rootOf=e=>{while(e.parent)e=get(e.parent);return e};
const pathOf=e=>{const p=[];while(e){p.unshift(e);e=e.parent?get(e.parent):null}return p};
const attrsOf=id=>[...els.values()].filter(e=>e.parent===id&&e.state==='attr');
const kidsOf=id=>[...els.values()].filter(e=>e.parent===id&&e.state==='node');
const membersOf=rid=>[...els.values()].filter(e=>e.id!==rid&&rootOf(e).id===rid);
const colorOf=e=>gColor.get(rootOf(e).id);
const kindOf=e=>e.state==='attr'?D.labels.attr:(e.parent?D.labels.node:D.labels.root);
const relColor=t=>D.relColors[t]||'#9fb4c8';
const nodeR=id=>{const e=get(id);return (e.parent?11:17)+(id===S.focus?4:0)};
const orbitR=id=>nodeR(id)+26+Math.min(12,attrsOf(id).length*1.8);

/* ============================================================ 星域装载 + 星团总览数据 */
const DCOL={skill:'#5cf2ff',idea:'#ff6bd5',res:'#ffb547',proj:'#6dff9c'};
const PACKS={};
const isDom=id=>typeof id==='string'&&id.startsWith('dom:');
function usePack(k){S.dk=k;D=DOMAINS[k];({els,rels,gColor,GAL,cross}=PACKS[k])}
function initPacks(){
  const keys=Object.keys(DOMAINS);
  keys.forEach(k=>{
    D=DOMAINS[k];
    els=new Map(D.elements.map(e=>[e.id,{...e}]));
    rels=D.relations.map((r,i)=>({...r,id:'r'+i}));
    gColor=new Map();let i=0;
    for(const e of els.values()) if(!e.parent) gColor.set(e.id,PALETTE[i++%PALETTE.length]);
    buildCluster();
    const gs=[...GAL.values()],n=gs.length||1,cx=gs.reduce((s,g)=>s+g.x,0)/n,cy=gs.reduce((s,g)=>s+g.y,0)/n;
    gs.forEach(g=>{g.x-=cx;g.y-=cy});
    const nNode=[...els.values()].filter(e=>e.state==='node').length;
    PACKS[k]={k,els,rels,gColor,GAL,cross,col:DCOL[k],cx:0,cy:0,nNode,nAttr:els.size-nNode,
      ext:Math.max(300,...gs.map(g=>Math.hypot(g.x,g.y)+g.r+120))};
  });
  // 星域在顶级平面上环形排布
  const E=Math.max(...keys.map(k=>PACKS[k].ext)),Rc=E*2.05;
  keys.forEach((k,i)=>{const a=i/keys.length*Math.PI*2-Math.PI*.75,pk=PACKS[k];
    pk.cx=Math.cos(a)*Rc;pk.cy=Math.sin(a)*Rc;pk.GAL.forEach(g=>{g.x+=pk.cx;g.y+=pk.cy})});
}

function buildCluster(){
  GAL=new Map();
  const roots=[...els.values()].filter(e=>!e.parent);
  // 跨星系关联（按 起点星系 → 终点星系 聚合）
  const cm=new Map();
  rels.forEach(r=>{const a=rootOf(get(r.from)).id,b=rootOf(get(r.to)).id;if(a===b)return;
    const k=a+'>'+b;if(!cm.has(k))cm.set(k,{a,b,count:0,types:new Map()});
    const c=cm.get(k);c.count++;c.types.set(r.type,(c.types.get(r.type)||0)+1)});
  cross=[...cm.values()];
  const n=roots.length;
  roots.forEach((r,i)=>{
    const mem=membersOf(r.id),col=gColor.get(r.id),ang=i/n*Math.PI*2;
    const g={id:r.id,col,r:115+24*Math.sqrt(mem.length+1),inc:0,phi:hash(r.id+'φ')*6.28,
      arms:2+(hash(r.id+'a')>.55?1:0),x:Math.cos(ang)*(160+110*n),y:Math.sin(ang)*(160+110*n),parts:[],
      mem:mem.filter(e=>e.state==='node'),nAttr:mem.filter(e=>e.state==='attr').length};
    g.styles=[mix(col,.08),mix(col,.4),mix(col,.75),[255,150,210]].flatMap(c=>[`rgba(${c},.4)`,`rgba(${c},.85)`]);
    const cnt=Math.min(1500,700+mem.length*35);   // 星系多时控制粒子总量
    for(let k=0;k<cnt;k++){
      const u=Math.pow(Math.random(),.75),rr=u*g.r,arm=k%g.arms;
      const th=arm*Math.PI*2/g.arms+u*3.8+gauss()*(.6*(1-u)+.16);
      // 颜色分 4 档 × 透明度 2 档，绘制时按档批量填充
      const coreT=Math.max(0,1-u/.32),tier=Math.random()<.05?3:coreT>.45?2:(coreT>0||Math.random()<.3)?1:0;
      g.parts.push({rr,th,lh:gauss()*12*(1-u),w:.11*(1.25-u*.7),b:tier*2+(u>.7||Math.random()<.45?0:1),
        sz:(.8+Math.random()*1.6)*(Math.random()<.04?2.4:1)});
    }
    buildMini(g);
    GAL.set(r.id,g);
  });
  // 星系间的简单布局：互斥 + 跨星系关联拉近
  const gs=[...GAL.values()];
  for(let it=0;it<600;it++){
    for(let a=0;a<gs.length;a++)for(let b=a+1;b<gs.length;b++){
      const A_=gs[a],B_=gs[b];let dx=B_.x-A_.x,dy=B_.y-A_.y,d=Math.hypot(dx,dy)||1;const m=A_.r+B_.r+240;
      if(d<m){const f=(m-d)*.2;A_.x-=dx/d*f;A_.y-=dy/d*f;B_.x+=dx/d*f;B_.y+=dy/d*f}}
    cross.forEach(c=>{const A_=GAL.get(c.a),B_=GAL.get(c.b),dx=B_.x-A_.x,dy=B_.y-A_.y,d=Math.hypot(dx,dy)||1,f=(d-(A_.r+B_.r+300))*.01;
      A_.x+=dx/d*f;A_.y+=dy/d*f;B_.x-=dx/d*f;B_.y-=dy/d*f});
    gs.forEach(g=>{g.x*=.999;g.y*=.999});
  }
}

// 缩微结构：根节点居中，按隶属层级排成同心轨道（最多 3 级，节点多时减少层级）
const KM=1.3;
function buildMini(g){
  const dep=new Map([[g.id,0]]),order=[g.id];
  for(let i=0;i<order.length;i++)for(const k of kidsOf(order[i])){dep.set(k.id,dep.get(order[i])+1);order.push(k.id)}
  let L=Math.min(3,Math.max(1,...dep.values()));const cnt=l=>order.filter(id=>dep.get(id)<=l).length-1;
  while(L>1&&cnt(L)>30)L--;
  const kids=id=>kidsOf(id).filter(k=>dep.get(k.id)<=L);
  const wt=id=>{const ks=kids(id);return ks.length?ks.reduce((s,k)=>s+wt(k.id),0):1};
  g.mini=new Map();g.L=L;
  const place=(id,a0,a1)=>{g.mini.set(id,{lev:dep.get(id),ang:(a0+a1)/2});
    const ks=kids(id),tot=ks.reduce((s,k)=>s+wt(k.id),0);let a=a0;
    ks.forEach(k=>{const sp=(a1-a0)*wt(k.id)/tot;place(k.id,a,a+sp);a+=sp})};
  const a0=hash(g.id)*6.28;place(g.id,a0,a0+Math.PI*2);
  g.shown=g.mini.size-1;
}
const miniR=(g,lev)=>lev?g.r*(.36+.24*(lev-1)):0;
// 节点在星团总览中的缩微位置；未显示的层级取最近的已显示祖先
function miniAt(g,m){const r=miniR(g,m.lev),a=m.ang+T*.05;return {x:g.x+Math.cos(a)*r,y:g.y+Math.sin(a)*r,h:40}}
function miniPos(id){
  let e=get(id);const g=GAL.get(rootOf(e).id);
  while(!g.mini.has(e.id))e=get(e.parent);
  return {...miniAt(g,g.mini.get(e.id)),exact:e.id===id};
}

/* ============================================================ 焦点距离计算 */
function recompute(){
  const nodes=[...els.values()].filter(e=>e.state==='node');
  const adj=new Map(nodes.map(n=>[n.id,new Set()]));
  const link=(a,b)=>{if(a!==b){adj.get(a).add(b);adj.get(b).add(a)}};
  nodes.forEach(n=>{if(n.parent)link(n.id,n.parent)});        // 隶属：+1
  rels.forEach(r=>link(ownerId(r.from),r.to));                 // 非隶属：+1（属性与所属节点距离 0）
  const dist=new Map([[S.focus,0]]),pred=new Map(),q=[S.focus];
  while(q.length){const u=q.shift(),d=dist.get(u);
    for(const v of adj.get(u)) if(!dist.has(v)){dist.set(v,d+1);pred.set(v,u);q.push(v)}}
  const vis=new Set([...dist].filter(([,d])=>d<=S.range).map(([id])=>id));
  const boundary=new Map();
  for(const id of vis) if(dist.get(id)===S.range){
    const n=[...adj.get(id)].filter(v=>!vis.has(v)).length; if(n) boundary.set(id,n)}
  const subs=nodes.filter(n=>n.parent&&vis.has(n.id)&&vis.has(n.parent)).map(n=>[n.parent,n.id]);
  const vr=rels.filter(r=>vis.has(ownerId(r.from))&&vis.has(r.to));
  view={vis,dist,subs,rels:vr,boundary,adj};heat=1;
  for(const id of vis){
    let s=sim.get(id);
    if(!s){const p=sim.get(pred.get(id))||{x:0,y:0,h:60},a=Math.random()*Math.PI*2;
      s={x:p.x+Math.cos(a)*70,y:p.y+Math.sin(a)*70,h:p.h,vx:0,vy:0,a:0,k:1,ph:Math.random()*6.28,inc:.25+hash(id)*.5};sim.set(id,s)}
    s.ta=1;s.dist=dist.get(id);
  }
  for(const [id,s] of sim) if(!vis.has(id)) s.ta=0;
}

function setFocus(id,keepSel){
  if(S.mode!=='focus'){enterGalaxy(rootOf(get(id)).id,id,keepSel?S.sel:null);return}
  S.focus=id;recompute();
  if(!keepSel) S.sel=id;
  follow=true;renderAll();
}
function setRange(r){
  r=clamp(r,1,MAXR);if(r===S.range||S.mode!=='focus')return;
  S.range=r;recompute();follow=true;renderHUD();renderDetail();
}

/* ============================================================ 模式切换（星团总览 ⇄ 焦点星图） */
const ease=t=>t*t*(3-2*t);
function enterGalaxy(rid,focusId=rid,selId=null){
  if(trans)return;
  if(S.mode==='focus'){setFocus(focusId);if(selId)select(selId);return}
  S.mode='focus';sim.clear();S.focus=focusId;
  const m0=miniPos(focusId);S.anchor={x:m0.x,y:m0.y};
  recompute();
  // 从总览中的缩微位置出发展开；其他星系的节点从各自星系飞来
  for(const [id,s] of sim){const m=miniPos(id);
    s.x=m.x+(m.exact?0:(Math.random()-.5)*16);s.y=m.y+(m.exact?0:(Math.random()-.5)*16);s.h=40;s.k=KM;s.a=m.exact?1:0}
  S.sel=selId||focusId;S.hover=null;follow=true;cam.uz=1;
  trans={kind:'in',t:0,rid};showTip(null);renderAll();
}
function goOverview(){
  if(trans||S.mode==='overview')return;
  trans={kind:'out',t:0,rid:rootOf(get(S.focus)).id};
  follow=true;cam.uz=1;S.hover=null;showTip(null);
}
function finishTrans(){
  const t=trans;trans=null;
  if(t.kind==='out'){S.mode='overview';sim.clear();S.focus=null;S.sel=t.rid}
  renderAll();
  if(t.next==='up')goUniverse();
}
// 顶级总览 → 某个星域的星团总览：相机直接飞过去（四个星域在同一平面上）
function enterDomain(k){
  if(trans)return;
  if(S.mode==='focus'){sim.clear();S.focus=null}
  usePack(k);S.mode='overview';S.sel=null;S.hover=null;follow=true;cam.uz=1;
  trans={kind:'down',t:0};showTip(null);$('#q').value='';renderResults();renderAll();
}
function goUniverse(){
  if(trans||S.mode==='universe')return;
  if(S.mode==='focus'){goOverview();if(trans)trans.next='up';return}
  S.mode='universe';S.sel='dom:'+S.dk;S.hover=null;follow=true;cam.uz=1;
  trans={kind:'up',t:0};showTip(null);renderAll();
}
function go2(k,id){

/* ============================================================ 力导布局（以焦点为中心的环形分层） */
let heat=1;
function step(dt){
  if(trans&&trans.kind==='out'){const k=Math.min(1,dt*3.5);
    for(const [id,s] of sim){const m=miniPos(id);s.x+=(m.x-s.x)*k;s.y+=(m.y-s.y)*k;s.h+=(m.h-s.h)*k;s.k+=(KM-s.k)*k;if(!m.exact)s.a+=(0-s.a)*k}
    return}
  heat=Math.max(.12,heat-dt*.18);
  const act=[...sim.entries()].filter(([,s])=>s.ta>0);
  const fs=sim.get(S.focus);
  const F=new Map(act.map(([id])=>[id,{x:0,y:0}]));
  for(let i=0;i<act.length;i++){const [ia,a]=act[i],ra=orbitR(ia)+34;
    for(let j=i+1;j<act.length;j++){const [ib,b]=act[j],rb=orbitR(ib)+34;
      let dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy;if(d2<1){dx=Math.random();dy=Math.random();d2=1}
      const d=Math.sqrt(d2);let f=20000/d2;
      if(d<ra+rb) f+=(ra+rb-d)*.25;
      const fx=dx/d*f,fy=dy/d*f;
      // 同一距离环上的星体沿环切向互相推开，使其在环上均匀散布
      if(fs&&a.dist===b.dist&&a.dist>0){
        const aa=Math.atan2(a.y-fs.y,a.x-fs.x),ab=Math.atan2(b.y-fs.y,b.x-fs.x);
        let dl=ab-aa;dl=Math.atan2(Math.sin(dl),Math.cos(dl));
        const t=Math.sign(dl||1)*3.2/(Math.abs(dl)+.3);
        F.get(ia).x-=-Math.sin(aa)*t;F.get(ia).y-=Math.cos(aa)*t;
        F.get(ib).x+=-Math.sin(ab)*t;F.get(ib).y+=Math.cos(ab)*t}
      F.get(ia).x-=fx;F.get(ia).y-=fy;F.get(ib).x+=fx;F.get(ib).y+=fy}}
  const spring=(p,c,L,k)=>{const a=sim.get(p),b=sim.get(c);if(!a||!b||!F.has(p)||!F.has(c))return;
    const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,f=(d-L)*k;
    F.get(p).x+=dx/d*f;F.get(p).y+=dy/d*f;F.get(c).x-=dx/d*f;F.get(c).y-=dy/d*f};
  view.subs.forEach(([p,c])=>spring(p,c,170,.02));
  view.rels.forEach(r=>spring(ownerId(r.from),r.to,210,.012));
  for(const [id,s] of act){const f=F.get(id);if(id===S.focus){f.x+=(S.anchor.x-s.x)*.12;f.y+=(S.anchor.y-s.y)*.12}}
  for(const [id,s] of sim){
    const f=F.get(id)||{x:0,y:0};
    s.vx=(s.vx+f.x*heat)*.74;s.vy=(s.vy+f.y*heat)*.74;
    const v=Math.hypot(s.vx,s.vy);if(v>28){s.vx*=28/v;s.vy*=28/v}
    s.x+=s.vx*dt*30;s.y+=s.vy*dt*30;
    // 位置约束：把星体收拢到它所在的距离环上
    if(s.ta>0&&fs&&id!==S.focus){const dx=s.x-fs.x,dy=s.y-fs.y,d=Math.hypot(dx,dy)||1,k=1+(s.dist*GAP-d)/d*Math.min(1,dt*4);
      s.x=fs.x+dx*k;s.y=fs.y+dy*k}
    const th=id===S.focus?95:45+hash(id)*55;
    s.h+=(th-s.h)*Math.min(1,dt*2);
    s.a+=(s.ta-s.a)*Math.min(1,dt*3.5);s.k+=(1-s.k)*Math.min(1,dt*1.6);
    if(S.hover!==id && !(S.hover && get(S.hover).parent===id && get(S.hover).state==='attr')) s.ph+=dt*.16;
    if(s.ta===0&&s.a<.02) sim.delete(id);
  }
}

/* ============================================================ 相机与投影（倾斜的全息星图平面） */
let cy_,sy_,cp_,sp_;
function camPrep(){cy_=Math.cos(cam.yaw);sy_=Math.sin(cam.yaw);cp_=Math.cos(cam.pitch);sp_=Math.sin(cam.pitch)}
function P3(x,y,h){
  const dx=x-cam.x,dy=y-cam.y,rx=dx*cy_-dy*sy_,ry=dx*sy_+dy*cy_;
  const sy=ry*cp_-h*sp_,d=-ry*sp_-h*cp_,k=FL/Math.max(300,FL+d*cam.z)*cam.z;  // 透视强度按屏幕尺度计算，远景与近景一致
  return {x:W/2+VX+rx*k,y:H/2+VY+sy*k,s:k,d};
}
function autoCam(force){
  let pts;
  if(S.mode==='universe')pts=Object.values(PACKS).flatMap(pk=>[...pk.GAL.values()].map(g=>({x:g.x,y:g.y,r:g.r+110})));
  else if(S.mode==='overview'||(trans&&trans.kind==='out'))pts=[...GAL.values()].map(g=>({x:g.x,y:g.y,r:g.r+70}));
  else if(trans){const R0=S.range*GAP+150;pts=[0,1,2,3,4,5,6,7].map(i=>({x:S.anchor.x+Math.cos(i*Math.PI/4)*R0,y:S.anchor.y+Math.sin(i*Math.PI/4)*R0,r:0}))}
  else pts=[...sim].filter(([,s])=>s.ta>0).map(([id,s])=>({x:s.x,y:s.y,r:orbitR(id)+60}));
  if(!pts.length)return;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  pts.forEach(p=>{x0=Math.min(x0,p.x-p.r);x1=Math.max(x1,p.x+p.r);y0=Math.min(y0,p.y-p.r);y1=Math.max(y1,p.y+p.r)});
  const cx=(x0+x1)/2,cy=(y0+y1)/2;
  if(follow){cam.tx=cx;cam.ty=cy}
  // 以目标视角投影包围点，按屏幕上的实际占用迭代求缩放
  const sv=[cam.x,cam.y,cam.z,cam.yaw,cam.pitch];
  const vb=viewBox(),w=W-vb.l-vb.r-30,h=H-vb.t-vb.b;
  tVX=(vb.l-vb.r)/2;tVY=(vb.t-vb.b)/2+10;
  let z=clamp(cam.tz/cam.uz,.01,3.5);
  cam.x=cam.tx;cam.y=cam.ty;cam.yaw=cam.tyaw;cam.pitch=cam.tpitch;camPrep();
  for(let it=0;it<3;it++){
    cam.z=z;let mx=1,my=1;
    pts.forEach(p=>{for(let k=0;k<8;k++){const a=k*Math.PI/4;for(const hh of [0,100]){const q=P3(p.x+Math.cos(a)*p.r,p.y+Math.sin(a)*p.r,hh);
      mx=Math.max(mx,Math.abs(q.x-W/2-VX));my=Math.max(my,Math.abs(q.y-H/2-VY))}}});
    z=clamp(z*Math.min(w/2/mx,h/2/my),.01,3.5);
  }
  [cam.x,cam.y,cam.z,cam.yaw,cam.pitch]=sv;camPrep();
  cam.tz=clamp(z*cam.uz,.01,3.5);
}

/* ============================================================ 精灵贴图 */
const SPR=new Map();
function mkC(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function sprite(kind,col){
  const key=kind+col;if(SPR.has(key))return SPR.get(key);
  const [r,g,b]=rgb(col);let c,x;
  let sd=Math.floor(hash(key)*2147483646)+1;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;
  if(kind==='glow'){c=mkC(256,256);x=c.getContext('2d');const gr=x.createRadialGradient(128,128,0,128,128,128);
    gr.addColorStop(0,`rgba(${r},${g},${b},1)`);gr.addColorStop(.08,`rgba(${r},${g},${b},.6)`);gr.addColorStop(.25,`rgba(${r},${g},${b},.18)`);
    gr.addColorStop(.6,`rgba(${r},${g},${b},.04)`);gr.addColorStop(1,`rgba(${r},${g},${b},0)`);x.fillStyle=gr;x.fillRect(0,0,256,256)}
  else if(kind==='core'){c=mkC(128,128);x=c.getContext('2d');const gr=x.createRadialGradient(64,64,0,64,64,64);
    gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.22,'rgba(255,255,255,.9)');gr.addColorStop(.45,`rgba(${mix(col,.5)},.5)`);gr.addColorStop(1,`rgba(${r},${g},${b},0)`);
    x.fillStyle=gr;x.fillRect(0,0,128,128)}
  else if(kind==='corona1'||kind==='corona2'){c=mkC(512,512);x=c.getContext('2d');x.globalCompositeOperation='lighter';
    for(let i=0;i<190;i++){const a=rnd()*6.283,L=256*(.28+.72*Math.pow(rnd(),2.2)),w=.5+rnd()*2.4,ex=256+Math.cos(a)*L,ey=256+Math.sin(a)*L;
      const lg=x.createLinearGradient(256,256,ex,ey);lg.addColorStop(0,'rgba(255,255,255,0)');lg.addColorStop(.1,'rgba(255,248,230,.5)');
      lg.addColorStop(.38,`rgba(${r},${g},${b},.28)`);lg.addColorStop(1,`rgba(${r},${g},${b},0)`);
      x.strokeStyle=lg;x.lineWidth=w;x.beginPath();x.moveTo(256,256);x.lineTo(ex,ey);x.stroke()}}
  else if(kind==='band'){c=mkC(256,128);x=c.getContext('2d');
    x.fillStyle=`rgb(${mix(col,.55,[4,8,24])})`;x.fillRect(0,0,256,128);
    for(let i=0;i<26;i++){const y=rnd()*128,hh=2+rnd()*13,t=rnd(),amp=rnd()*5,ph=rnd()*6.28,k=1+Math.floor(rnd()*3);
      const cc=rnd()<.55?mix(col,t*.65):mix(col,.3+t*.5,[6,10,30]);x.fillStyle=`rgba(${cc},${.25+rnd()*.5})`;
      x.beginPath();x.moveTo(0,y);for(let X=0;X<=256;X+=8)x.lineTo(X,y+Math.sin(X/256*6.283*k+ph)*amp);
      for(let X=256;X>=0;X-=8)x.lineTo(X,y+hh+Math.sin(X/256*6.283*k+ph+1)*amp);x.fill()}}
  SPR.set(key,c);return c;
}
function spr(img,x,y,size,a,rot){
  if(a<=0||size<=0)return;ctx.globalAlpha=Math.min(1,a);
  if(rot){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.drawImage(img,-size/2,-size/2,size,size);ctx.restore()}
  else ctx.drawImage(img,x-size/2,y-size/2,size,size);
  ctx.globalAlpha=1;
}

/* ============================================================ 绘制：背景 */
const cvs=$('#c'),ctx=cvs.getContext('2d');
let W,H,DPR,stars=[],neb,meteors=[];
function resize(){
  DPR=Math.min(2,devicePixelRatio||1);W=Math.max(1,innerWidth);H=Math.max(1,innerHeight);
  cvs.width=W*DPR;cvs.height=H*DPR;cvs.style.width=W+'px';cvs.style.height=H+'px';
  stars=[];
  [[.015,.7,W*H/2600],[.05,1.1,W*H/8000],[.12,1.7,W*H/30000]].forEach(([p,s,n])=>{
    for(let i=0;i<n;i++){const r=Math.random();
      stars.push({x:Math.random()*W,y:Math.random()*H,p,s:s*(.5+Math.random()),tw:Math.random()*6.28,ts:.6+Math.random()*2.4,
        c:r<.1?'255,214,170':r<.22?'170,200,255':'255,255,255'})}});

    if(isF){const rr=R+18+Math.sin(T*2.4)*2.5;ctx.strokeStyle=rgba('#ffffff',.9*la);ctx.lineWidth=1.6;

    ctx.textAlign='center';const ly=p.y+R+(isRoot?26:20);
    ctx.font=`${isRoot?'600 15px':'13px'} ${FONT}`;ctx.shadowColor=rgba(col,.9);ctx.shadowBlur=10;
    ctx.fillStyle=rgba('#ffffff',la);ctx.fillText(e.name,p.x,ly);ctx.shadowBlur=0;
    ctx.font=`9.5px ${MONO}`;ctx.fillStyle=rgba(col,.8*la);ctx.fillText(`${kindOf(e)} · D${s.dist??'-'}`,p.x,ly+13);
    if(S.opts.fnLabels&&e.fn){const full=isF||S.hover===id||S.sel===id;
      ctx.font=`${full?12:11}px ${FONT}`;ctx.fillStyle=rgba('#d2e4f4',(full?.95:.7)*la);ctx.fillText(full?e.fn:clip(e.fn,16),p.x,ly+29)}

/* ============================================================ 绘制：星团总览 */
function galaxyPoint(g,rr,th,lh){
  const lx=Math.cos(th)*rr,ly=Math.sin(th)*rr,y2=ly*Math.cos(g.inc),z2=ly*Math.sin(g.inc)+lh,cf=Math.cos(g.phi),sf=Math.sin(g.phi);
  return P3(g.x+lx*cf-y2*sf,g.y+lx*sf+y2*cf,40+z2);
}
function galaxyBody(g,p,al,boost,ex){
  if(al<=.003)return;
  ctx.globalCompositeOperation='lighter';
  spr(sprite('glow',g.col),p.x,p.y,g.r*2.6*p.s,al*.35*boost);
  const st=Math.max(1,Math.round(80/Math.max(1,g.r*p.s)));   // 远景时抽稀星尘
  ctx.globalAlpha=Math.min(1,al*boost*.6);
  const paths=g.styles.map(()=>new Path2D()),k=Math.max(.6,p.s*1.3)*(st>1?1.4:1);
  for(let i=0;i<g.parts.length;i+=st){const q=g.parts[i],pp=galaxyPoint(g,q.rr,q.th+T*q.w,q.lh),sz=q.sz*k;paths[q.b].rect(pp.x-sz/2,pp.y-sz/2,sz,sz)}
  paths.forEach((ph,b)=>{ctx.fillStyle=g.styles[b];ctx.fill(ph)});
  ctx.globalAlpha=1;
  spr(sprite('glow',g.col),p.x,p.y,g.r*1.1*p.s,al*.9);
  ctx.globalCompositeOperation='source-over';
  // 缩微结构：层级轨道 + 根节点恒星 + 其余节点为明亮卫星（不显示名称）
  for(let l=1;l<=g.L;l++){ring3(g.x,g.y,miniR(g,l),40,48);ctx.strokeStyle=rgba(g.col,.35*al);ctx.lineWidth=1;ctx.stroke()}
  [...g.mini].filter(([id])=>!ex||!ex.has(id)).map(([id,m])=>{const q=miniAt(g,m);return {m,q:P3(q.x,q.y,q.h)}})
    .sort((a,b)=>b.q.d-a.q.d).forEach(({m,q})=>{if(m.lev)drawSat(q.x,q.y,11*KM*q.s,g.col,al);else drawSun(q.x,q.y,17*KM*q.s,g.col,al)});
}
function drawOverview(A,ex,B=A){
  const gs=[...GAL.values()];
  const cx=gs.reduce((s,g)=>s+g.x,0)/gs.length,cy=gs.reduce((s,g)=>s+g.y,0)/gs.length;
  const ext=Math.max(...gs.map(g=>Math.hypot(g.x-cx,g.y-cy)+g.r))+120;
  const hv=S.hover&&GAL.has(S.hover)?S.hover:(S.hover&&els.has(S.hover)?rootOf(get(S.hover)).id:null);
  const linked=new Set(hv?[hv,...cross.filter(c=>c.a===hv||c.b===hv).flatMap(c=>[c.a,c.b])]:[]);
  const gdim=id=>hv&&!linked.has(id)?.3:1;

  // 平面网格
  ring3(cx,cy,ext,0,120);ctx.fillStyle=`rgba(40,120,200,${.04*A})`;ctx.fill();
  for(let r=ext/4;r<=ext+1;r+=ext/4){ring3(cx,cy,r);ctx.strokeStyle=`rgba(92,242,255,${.1*A})`;ctx.lineWidth=1;ctx.setLineDash([3,7]);ctx.stroke();ctx.setLineDash([])}
  for(let i=0;i<24;i++){const a=i/24*Math.PI*2,p0=P3(cx+Math.cos(a)*ext*.25,cy+Math.sin(a)*ext*.25,0),p1=P3(cx+Math.cos(a)*ext,cy+Math.sin(a)*ext,0);
    ctx.strokeStyle=`rgba(92,242,255,${.05*A})`;ctx.beginPath();ctx.moveTo(p0.x,p0.y);ctx.lineTo(p1.x,p1.y);ctx.stroke()}
  for(let k=0;k<12;k++){const a0=T*.25-k*.04;ring3(cx,cy,ext,0,8,a0-.04,a0);const p0=P3(cx,cy,0);ctx.lineTo(p0.x,p0.y);ctx.closePath();
    ctx.fillStyle=`rgba(92,242,255,${(.07-k*.005)*A})`;ctx.fill()}
  {const c0=P3(cx,cy,0);ctx.textAlign='center';ctx.font=`11px ${MONO}`;ctx.fillStyle=`rgba(92,242,255,${.55*A})`;
    ctx.fillText(`${D.en} CLUSTER`,c0.x,c0.y);ring3(cx,cy,22,0,40);ctx.strokeStyle=`rgba(92,242,255,${.35*A})`;ctx.stroke()}

  // 星系间关联
  for(const c of cross){
    const ga=GAL.get(c.a),gb=GAL.get(c.b),al=A*(hv?(c.a===hv||c.b===hv?1:.12):1);
    const a3={x:ga.x,y:ga.y,h:40},b3={x:gb.x,y:gb.y,h:40},len=Math.hypot(gb.x-ga.x,gb.y-ga.y);
    const rev=cross.some(o=>o.a===c.b&&o.b===c.a);
    let pts=arc3(a3,b3,rev?len*.12*(c.a<c.b?1:-1):0,len*.3+60,40);
    pts=trimPts(pts,ga.r*.32*pts[0].s,gb.r*.32*pts[pts.length-1].s);if(pts.length<2)continue;
    const types=[...c.types],col=types.length===1?relColor(types[0][0]):'#cfefff';
    flowLine(pts,col,al,1.2+c.count*.8,false,hash(c.a+c.b));
    arrow(pts,rgba(col,al),13);
    const m=along(pts,rev?(c.a<c.b?.4:.6):.5);pill(m.x,m.y,types.map(([t,n])=>n>1?`${t}×${n}`:t).join(' · '),col,al);
  }

  // 星系（螺旋星系粒子盘）
  const order=gs.map(g=>({g,p:P3(g.x,g.y,40)})).sort((a,b)=>b.p.d-a.p.d);
  for(const {g,p} of order){
    const al=A*gdim(g.id),act=hv===g.id||S.sel===g.id,boost=act?1.25:1;
    galaxyBody(g,p,B*gdim(g.id),boost,ex);
    // 选中 / 悬停：环绕准星
    if(act){ring3(g.x,g.y,g.r*1.08,40,96);ctx.strokeStyle=rgba('#ffffff',.6*al);ctx.lineWidth=1.2;ctx.setLineDash([10,8]);ctx.lineDashOffset=-T*20;ctx.stroke();ctx.setLineDash([])}
    // 名称
    const r=get(g.id),mem=g.mem.length;
    ctx.textAlign='center';ctx.font=`600 ${act?19:17}px ${FONT}`;ctx.shadowColor=rgba(g.col,.95);ctx.shadowBlur=14;
    ctx.fillStyle=`rgba(255,255,255,${al})`;ctx.fillText(r.name,p.x,p.y+g.r*.55*p.s+30);ctx.shadowBlur=0;
    let ly2=p.y+g.r*.55*p.s+47;
    if(S.opts.fnLabels&&r.fn){ctx.font=`${act?12.5:11.5}px ${FONT}`;ctx.fillStyle=`rgba(214,230,246,${(act?.95:.72)*al})`;ctx.fillText(act?r.fn:clip(r.fn,18),p.x,ly2);ly2+=15}
    if(act||gs.length<=8){   // 星系较多时只在悬停 / 选中时显示统计行，避免文字重叠
      ctx.font=`10px ${MONO}`;ctx.fillStyle=rgba(g.col,.85*al);
      ctx.fillText(`${D.labels.root} · ${mem} 节点 · ${g.nAttr} 属性 · 显示 ${g.L} 级`,p.x,ly2)}
    hits.push({id:g.id,x:p.x,y:p.y,r:Math.max(36,g.r*.55*p.s),pri:1});
  }
}

/* ============================================================ 绘制：顶级总览 */
function drawUniverse(A,exK){
  const pks=Object.values(PACKS);
  const ext=Math.max(...pks.map(pk=>Math.hypot(pk.cx,pk.cy)+pk.ext))+260;
  const hvK=isDom(S.hover)?S.hover.slice(4):null,selK=isDom(S.sel)?S.sel.slice(4):null;
  ring3(0,0,ext,0,160);ctx.fillStyle=`rgba(40,90,200,${.035*A})`;ctx.fill();
  for(let i=1;i<=5;i++){ring3(0,0,ext*i/5,0,140);ctx.strokeStyle=`rgba(92,242,255,${.08*A})`;ctx.lineWidth=1;ctx.setLineDash([2,8]);ctx.stroke();ctx.setLineDash([])}
  for(let i=0;i<36;i++){const a=i/36*Math.PI*2,p0=P3(Math.cos(a)*ext*.12,Math.sin(a)*ext*.12,0),p1=P3(Math.cos(a)*ext,Math.sin(a)*ext,0);
    ctx.strokeStyle=`rgba(92,242,255,${.04*A})`;ctx.beginPath();ctx.moveTo(p0.x,p0.y);ctx.lineTo(p1.x,p1.y);ctx.stroke()}
  for(let k=0;k<14;k++){const a0=T*.18-k*.035;ring3(0,0,ext,0,8,a0-.035,a0);const p0=P3(0,0,0);ctx.lineTo(p0.x,p0.y);ctx.closePath();
    ctx.fillStyle=`rgba(92,242,255,${(.06-k*.004)*A})`;ctx.fill()}
  // 中枢与星域之间的引导线（只表示归属于同一总览，不是关联）
  const c0=P3(0,0,0);
  for(const pk of pks){const q=P3(pk.cx,pk.cy,0);ctx.strokeStyle=rgba(pk.col,.16*A);ctx.setLineDash([3,9]);ctx.lineDashOffset=-T*12;
    ctx.beginPath();ctx.moveTo(c0.x,c0.y);ctx.lineTo(q.x,q.y);ctx.stroke();ctx.setLineDash([])}
  ring3(0,0,ext*.05,0,48);ctx.strokeStyle=`rgba(92,242,255,${.5*A})`;ctx.stroke();
  ring3(0,0,ext*.08,0,48,T*.4,T*.4+2);ctx.strokeStyle=`rgba(255,255,255,${.6*A})`;ctx.lineWidth=1.5;ctx.stroke();ctx.lineWidth=1;
  ctx.textAlign='center';ctx.font=`11px ${MONO}`;ctx.fillStyle=`rgba(92,242,255,${.7*A})`;ctx.fillText('STARMAP · UNIVERSE',c0.x,c0.y+4);

  const order=pks.map(pk=>({pk,c:P3(pk.cx,pk.cy,0)})).sort((a,b)=>b.c.d-a.c.d);
  for(const {pk,c} of order){
    const act=hvK===pk.k||selK===pk.k,dimF=hvK&&!act?.45:1,al=A*dimF,d=DOMAINS[pk.k];
    ctx.globalCompositeOperation='lighter';spr(sprite('glow',pk.col),c.x,c.y,pk.ext*2.8*c.s,al*.22*(act?1.5:1));ctx.globalCompositeOperation='source-over';
    ring3(pk.cx,pk.cy,pk.ext,0,140);ctx.strokeStyle=rgba(pk.col,(act?.75:.35)*al);ctx.lineWidth=act?1.8:1;
    ctx.setLineDash([14,9]);ctx.lineDashOffset=-T*16;ctx.stroke();ctx.setLineDash([]);ctx.lineWidth=1;
    for(let i=0;i<48;i++){const a=i/48*Math.PI*2,r2=pk.ext*(i%4?1.02:1.05),q1=P3(pk.cx+Math.cos(a)*pk.ext,pk.cy+Math.sin(a)*pk.ext,0),q2=P3(pk.cx+Math.cos(a)*r2,pk.cy+Math.sin(a)*r2,0);
      ctx.strokeStyle=rgba(pk.col,.3*al);ctx.beginPath();ctx.moveTo(q1.x,q1.y);ctx.lineTo(q2.x,q2.y);ctx.stroke()}
    if(pk.k!==exK)[...pk.GAL.values()].map(g=>({g,p:P3(g.x,g.y,40)})).sort((a,b)=>b.p.d-a.p.d).forEach(({g,p})=>galaxyBody(g,p,al,act?1.2:1,null));
    const lp=P3(pk.cx+sy_*pk.ext,pk.cy+cy_*pk.ext,0);
    ctx.textAlign='center';ctx.font=`700 ${act?24:21}px ${FONT}`;ctx.shadowColor=rgba(pk.col,.95);ctx.shadowBlur=16;
    ctx.fillStyle=`rgba(255,255,255,${al})`;ctx.fillText(d.name,lp.x,lp.y+32);ctx.shadowBlur=0;
    ctx.font=`11px ${MONO}`;ctx.fillStyle=rgba(pk.col,.9*al);
    ctx.fillText(`${d.en} · ${pk.GAL.size} 星系 · ${pk.nNode} 节点 · ${pk.nAttr} 属性`,lp.x,lp.y+50);
    hits.push({id:'dom:'+pk.k,x:c.x,y:c.y,r:Math.max(50,pk.ext*c.s*.8),pri:0});
  }
}

/* ============================================================ 主循环 */
let last=performance.now();
function frame(now){
  const dt=clamp((now-last)/1000,0,.05);last=Math.max(last,now);T+=dt;
  warp=Math.max(0,warp-dt*1.4);
  if(S.opts.spin&&!drag.on)cam.tyaw+=dt*.035;
  const fly=trans&&(trans.kind==='down'||trans.kind==='up');
  if(trans){trans.t+=dt/(trans.kind==='in'?1.6:trans.kind==='out'?1.3:1.9);if(trans.t>=1)finishTrans()}
  if(S.mode==='focus')step(dt);
  autoCam();
  const k=Math.min(1,dt*(fly?1.7:trans?2.4:3));
  cam.x+=(cam.tx-cam.x)*k;cam.y+=(cam.ty-cam.y)*k;cam.z=Math.exp(Math.log(cam.z)+(Math.log(cam.tz)-Math.log(cam.z))*k);
  cam.yaw+=(cam.tyaw-cam.yaw)*Math.min(1,dt*6);cam.pitch+=(cam.tpitch-cam.pitch)*Math.min(1,dt*6);
  VX+=(tVX-VX)*Math.min(1,dt*4);VY+=(tVY-VY)*Math.min(1,dt*4);
  camPrep();
  drawBackground(dt);
  hits=[];
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(trans&&(trans.kind==='down'||trans.kind==='up')){
    const t=trans.t,seg=(a,b)=>ease(clamp((t-a)/(b-a),0,1));
    const uA=trans.kind==='down'?1-seg(0,.5):seg(.4,1),oA=trans.kind==='down'?seg(.45,1):1-seg(0,.45);
    drawUniverse(uA,S.dk);drawOverview(oA,null,1)}
  else if(trans){
    // 分段交叉淡化：先让旧图层的装饰退场，星体在两图层间连续移动，再让新图层的装饰进场
    const t=trans.t,seg=(a,b)=>ease(clamp((t-a)/(b-a),0,1));
    const ovA=trans.kind==='in'?1-seg(0,.45):seg(.35,1),fA=trans.kind==='in'?seg(.4,1):1-seg(0,.4);
    const ex=new Set([...sim.keys()].filter(id=>miniPos(id).exact));
    drawOverview(ovA,ex);drawFocus(fA)}
  else if(S.mode==='universe')drawUniverse(1);
  else if(S.mode==='overview')drawOverview(1);else drawFocus(1);
  ctx.globalAlpha=1;
  requestAnimationFrame(frame);
}

/* ============================================================ 交互 */
const drag={on:false,moved:false,sx:0,sy:0,pan:false,down:null};
function hit(mx,my){
  let best=null,bd=1e9;
  for(const h of hits){const d=Math.hypot(h.x-mx,h.y-my);if(d<h.r){const sc=d-(h.pri*12);if(sc<bd){bd=sc;best=h.id}}}
  return best;
}
const tip=$('#tip');
function showTip(id,mx,my){
  if(isDom(id)){const pk=PACKS[id.slice(4)],d=DOMAINS[pk.k];
    tip.innerHTML=`<b style="color:${pk.col}">${esc(d.name)}</b><div class="t2">${esc(d.en)} · ${pk.GAL.size} 星系 · ${pk.nNode} 节点 · ${pk.nAttr} 属性 · 双击进入</div>`;
    tip.style.left=Math.min(W-270,mx+16)+'px';tip.style.top=(my+16)+'px';tip.style.opacity=1;return}
  if(!id||!els.has(id)){tip.style.opacity=0;return}
  const e=get(id);let l2;
  if(S.mode==='overview'){const g=GAL.get(id);
    if(!g){tip.style.opacity=0;return}
    l2=`星系 · ${g.mem.length} 节点 · ${g.nAttr} 属性 · 双击进入`}
  else l2=e.state==='attr'?`${kindOf(e)}（属性）· 属于 ${get(e.parent).name} · 距离同所属节点`:`${kindOf(e)}（节点）· 星系 ${rootOf(e).name} · 距焦点 ${view.dist.get(id)}`;
  tip.innerHTML=`<b style="color:${colorOf(e)}">${esc(e.name)}</b><div class="t2">${esc(l2)}</div>${e.fn?`<div class="t4">功能：${esc(e.fn)}</div>`:''}${e.desc?`<div class="t3">${esc(e.desc)}</div>`:''}`;
  tip.style.left=Math.min(W-270,mx+16)+'px';tip.style.top=(my+16)+'px';tip.style.opacity=1;
}
cvs.addEventListener('contextmenu',ev=>ev.preventDefault());
cvs.addEventListener('pointerdown',ev=>{
  cvs.setPointerCapture(ev.pointerId);
  drag.on=true;drag.moved=false;drag.sx=ev.clientX;drag.sy=ev.clientY;drag.pan=ev.button===2||ev.shiftKey;
  drag.down=hit(ev.clientX,ev.clientY);cvs.classList.add('drag');
});
cvs.addEventListener('pointermove',ev=>{
  if(drag.on){
    if(Math.abs(ev.clientX-drag.sx)+Math.abs(ev.clientY-drag.sy)>4)drag.moved=true;
    if(!drag.moved)return;
    if(drag.pan){
      follow=false;const dxs=ev.movementX/cam.z,dys=ev.movementY/(cam.z*Math.max(.3,cp_));
      cam.x-=dxs*cy_+dys*sy_;cam.y-=-dxs*sy_+dys*cy_;cam.tx=cam.x;cam.ty=cam.y;
    }else{
      cam.tyaw-=ev.movementX*.006;cam.yaw=cam.tyaw;
      cam.tpitch=clamp(cam.tpitch-ev.movementY*.004,.12,1.3);cam.pitch=cam.tpitch;
    }
    showTip(null);return;
  }
  if(trans)return;
  const h=hit(ev.clientX,ev.clientY);S.hover=h;cvs.classList.toggle('pointer',!!h);showTip(h,ev.clientX,ev.clientY);
});
cvs.addEventListener('pointerup',()=>{
  if(drag.on&&!drag.moved&&!trans){
    if(S.mode==='universe')select(drag.down||null);
    else if(S.mode==='overview'){const id=drag.down;select(id?(GAL.has(id)?id:rootOf(get(id)).id):null)}
    else select(drag.down||null);
  }
  drag.on=false;cvs.classList.remove('drag');
});
cvs.addEventListener('pointerleave',()=>{S.hover=null;showTip(null)});
cvs.addEventListener('dblclick',ev=>{
  const h=hit(ev.clientX,ev.clientY);if(!h||trans)return;
  if(S.mode==='universe'){if(isDom(h))enterDomain(h.slice(4));return}
  const e=get(h);
  if(S.mode==='overview'){enterGalaxy(rootOf(e).id,h);return}
  if(e.state==='node')setFocus(h);else{setFocus(e.parent,true);select(h)}
});
cvs.addEventListener('wheel',ev=>{
  ev.preventDefault();cam.uz=clamp(cam.uz*Math.exp(-ev.deltaY*.0012),.35,4);
},{passive:false});
addEventListener('keydown',ev=>{
  if(ev.target.tagName==='INPUT')return;
  if(ev.key==='+'||ev.key==='=')setRange(S.range+1);
  else if(ev.key==='-'||ev.key==='_')setRange(S.range-1);
  else if(ev.key==='Escape'){if(S.mode==='focus')goOverview();else if(S.mode==='overview')goUniverse();else select(null)}
  else if((ev.key==='f'||ev.key==='F')&&S.sel&&S.mode==='focus'){const e=get(S.sel);setFocus(e.state==='node'?e.id:e.parent,true)}

function renderResults(){

  if(S.mode==='universe'){  // 顶级总览下跨星域搜索
    const out=[];
    for(const pk of Object.values(PACKS))for(const e of pk.els.values()){
      if(!(e.name.toLowerCase().includes(q)||(e.fn||'').toLowerCase().includes(q)||(e.desc||'').toLowerCase().includes(q)))continue;
      let r=e;while(r.parent)r=pk.els.get(r.parent);const lb=DOMAINS[pk.k].labels;
      out.push(`<div class="item" data-go2="${pk.k}|${e.id}"><span class="dot ${e.state==='attr'?'attr':''}" style="color:${pk.gColor.get(r.id)}"></span><span class="nm">${esc(e.name)}</span><span class="meta">${esc(DOMAINS[pk.k].short)}·${esc(r.name)}</span></div>`)}
    $('#results').innerHTML=out.length?out.slice(0,12).join(''):'<div class="empty">无匹配要素</div>';return}
  const hitsQ=[...els.values()].filter(e=>e.name.toLowerCase().includes(q)||(e.fn||'').toLowerCase().includes(q)||(e.desc||'').toLowerCase().includes(q)).slice(0,12);

    h+=`<div class="sec"><h3><span>${esc(D.labels.node)} · 子节点</span><span>${kids.length}</span></h3>${kids.length?kids.map(k=>`<div class="row">${link(k.id)} <span class="via">${attrsOf(k.id).length} 属性</span></div>`).join(''):'<div class="empty">暂无子节点</div>'}</div>`;

    h+=`<div class="sec"><h3><span>入向关联</span><span>${inc.length}</span></h3>${inc.length?inc.map(r=>{const s=get(r.from);

}

document.addEventListener('click',ev=>{
  const t=ev.target;
  if(t.closest('[data-uni]')){goUniverse();return}
  if(t.closest('[data-ov]')){goOverview();return}
  const dm=t.closest('[data-dom]');if(dm){enterDomain(dm.dataset.dom);return}
  const ds=t.closest('[data-dsel]');if(ds){select('dom:'+ds.dataset.dsel);renderGalaxies();return}
  const g2=t.closest('[data-go2]');if(g2){const [k,id]=g2.dataset.go2.split('|');go2(k,id);return}
  const en=t.closest('[data-enter]');if(en){enterGalaxy(en.dataset.enter);return}
  const gl=t.closest('[data-gal]');if(gl){const id=gl.dataset.gal;if(S.mode==='overview')enterGalaxy(id);else setFocus(id);return}
  const gs=t.closest('[data-gsel]');if(gs){select(gs.dataset.gsel);return}
  const f=t.closest('[data-focus]');if(f&&!f.disabled){setFocus(f.dataset.focus);return}
  const s=t.closest('[data-sel]');if(s){if(S.mode==='overview'){const e=get(s.dataset.sel);enterGalaxy(rootOf(e).id,e.state==='node'?e.id:e.parent,e.id)}else select(s.dataset.sel);return}
  const g=t.closest('[data-go]');if(g)go(g.dataset.go);
});

  $('#legend').innerHTML=`
  <div class="lg"><svg width="44" height="26">${defs}<path d="M4 13H40" stroke="#ffb547" stroke-width=".8" opacity=".7"/><circle cx="22" cy="13" r="12" fill="url(#lgS)"/><circle cx="22" cy="13" r="3.5" fill="#fff"/></svg>恒星 · 根节点「${esc(D.labels.root)}」</div>
  <div class="lg"><svg width="44" height="20">${defs}<circle cx="22" cy="10" r="7" fill="url(#lgP)"/><path d="M15.5 8.5h13M15.2 11.5h13.6" stroke="#0a2a44" stroke-opacity=".5"/></svg>行星 · 节点「${esc(D.labels.node)}」</div>
  <div class="lg"><svg width="44" height="18"><ellipse cx="22" cy="9" rx="18" ry="6" fill="none" stroke="rgba(92,242,255,.4)" transform="rotate(-12 22 9)"/><circle cx="39" cy="6" r="2.5" fill="#dff"/><circle cx="8" cy="12" r="2.2" fill="#dff"/></svg>卫星 · 属性「${esc(D.labels.attr)}」</div>
  <div class="lg"><svg width="44" height="10"><line x1="2" y1="5" x2="42" y2="5" stroke="rgba(92,242,255,.75)" stroke-width="2"/><path d="M32 1.5L35.5 5L32 8.5L28.5 5Z" fill="rgba(92,242,255,.9)"/></svg>隶属（直线光束）</div>
  <div class="lg"><svg width="44" height="18"><line x1="22" y1="2" x2="22" y2="13" stroke="#5cf2ff" stroke-dasharray="2 2" opacity=".6"/><ellipse cx="22" cy="14" rx="7" ry="2.6" fill="none" stroke="#5cf2ff" opacity=".6"/></svg>投影线 · 星体在星图平面的位置</div>
  <div class="grp"><span class="lbl">RELATIONS · 关联</span>${rl}</div>
  <div class="lg grp"><svg width="44" height="12"><circle cx="6" cy="6" r="2.4" fill="#fff"/><circle cx="6" cy="6" r="5" fill="none" stroke="#fff" stroke-width="1"/><line x1="12" y1="6" x2="42" y2="6" stroke="#9fb4c8" stroke-dasharray="4 3"/></svg>起点有圈 = 来自具体属性</div>
  <div class="lg"><svg width="44" height="12"><circle cx="6" cy="6" r="2.4" fill="#9fb4c8"/><line x1="8" y1="6" x2="42" y2="6" stroke="#9fb4c8" stroke-dasharray="4 3"/></svg>起点贴星体 = 来自节点整体</div>
  <div class="lg"><span style="font-family:var(--mono);color:var(--amber);width:44px;text-align:center">+2 ›</span>范围外仍有相邻节点</div>`;
}
function renderTools(){
  const ov=S.mode!=='focus';
  $('#toOverview').style.display=S.mode==='universe'?'none':'';
  $('#toOverview').textContent=S.mode==='focus'?'◂ 星团总览':'◂ 顶级总览';
  document.querySelectorAll('.tools [data-opt="attrLabels"]').forEach(b=>b.style.display=ov?'none':'');
  $('#hint').textContent=S.mode==='universe'?'单击 选择星域 · 双击 进入星域 · 点击左上角 STARMAP 随时回到这里 · 拖拽 旋转 · 滚轮 缩放'
    :ov?'单击 选择星系 · 双击 进入星系 · 拖拽 旋转视角 · 右键/Shift+拖拽 平移 · 滚轮 缩放'
    :'单击 查看 · 双击 设为焦点 · 拖拽 旋转 · 右键/Shift+拖拽 平移 · 滚轮 缩放 · +/- 范围 · Esc 星团总览';
}
document.querySelectorAll('.tools [data-opt]').forEach(b=>b.onclick=()=>{S.opts[b.dataset.opt]=!S.opts[b.dataset.opt];b.classList.toggle('on')});
$('#recenter').onclick=()=>{follow=true;cam.uz=1;cam.tpitch=PITCH0};
$('#toOverview').onclick=()=>S.mode==='focus'?goOverview():goUniverse();

/* ============================================================ 面板收起 + 沉浸模式 */
const UI={col:{},imm:false};
try{Object.assign(UI,JSON.parse(localStorage.getItem('starmap.ui')||'{}'))}catch(e){}
const saveUI=()=>{try{localStorage.setItem('starmap.ui',JSON.stringify(UI))}catch(e){}};
function viewBox(){
  if(UI.imm)return {l:0,r:0,t:20,b:50};
  if(W<=860)return {l:0,r:0,t:60,b:60};
  const open=id=>!UI.col[id];
  return {l:open('left')||open('legendP')?290:0,r:open('rightP')?340:0,t:open('hud')?120:90,b:70};
}
function applyUI(){
  for(const id of ['hud','left','rightP','legendP']){
    const el=document.getElementById(id),c=!!UI.col[id],b=el.querySelector('[data-panel]');
    el.classList.toggle('collapsed',c);b.textContent=c?'+':'—';b.title=c?'展开':'收起';
  }
  document.body.classList.toggle('immersive',UI.imm);
  $('#immBtn').classList.toggle('on',UI.imm);
}
function toggleImm(){UI.imm=!UI.imm;applyUI();saveUI();showTip(null)}
document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();UI.col[b.dataset.panel]=!UI.col[b.dataset.panel];applyUI();saveUI()});
$('#immBtn').onclick=toggleImm;$('#immExit').onclick=toggleImm;
addEventListener('keydown',ev=>{if(ev.target.tagName!=='INPUT'&&(ev.key==='h'||ev.key==='H'))toggleImm()});
// 沉浸时底部只留一行位置提示
function renderCap(){
  let t;
  if(S.mode==='universe')t='STARMAP · 全部星域';
  else if(S.mode==='overview')t=`全部星域 › ${D.name}`;
  else{const f=get(S.focus);t=f?`${D.name} › ${rootOf(f).name} › ${f.name}`:D.name}
  $('#immCap').textContent=t+'　·　H 退出沉浸';
  // 位置提示中的上层可点击
  if(S.mode==='overview')$('#immCap').innerHTML=`<a data-uni>全部星域</a> › ${esc(D.name)}　·　Esc 上一层　·　H 退出沉浸`;
  else if(S.mode==='focus'&&get(S.focus)){const f=get(S.focus),r=rootOf(f);
    $('#immCap').innerHTML=`<a data-uni>全部星域</a> › <a data-ov>${esc(D.name)}</a> › ${r.id===f.id?esc(r.name):`<a data-focus="${r.id}">${esc(r.name)}</a> › ${esc(f.name)}`}　·　Esc 上一层　·　H 退出沉浸`}
  $('#immBack').classList.toggle('can',S.mode!=='universe');
  $('#immBack').textContent=S.mode==='focus'?'◂ 星团总览 · Esc':'◂ 顶级总览 · Esc';
}

function goUp(){if(trans)return;if(S.mode==='focus')goOverview();else if(S.mode==='overview')goUniverse()}
$('#immBack').onclick=goUp;
const manageUrl=id=>`manage.html#d=${S.dk}&s=${encodeURIComponent(id)}`;
function stateHash(){
  if(S.mode==='universe')return isDom(S.sel)?'':'';
  let h='d='+S.dk;
  if(S.mode==='focus'&&S.focus)h+=`&f=${encodeURIComponent(S.focus)}&r=${S.range}`;
  if(S.sel&&!isDom(S.sel)&&els.has(S.sel))h+=`&s=${encodeURIComponent(S.sel)}`;
  return h;
}
function syncHash(){
  const h=stateHash();
  try{history.replaceState(null,'',h?'#'+h:location.pathname+location.search)}catch(e){}
  const sel=S.mode==='universe'?(isDom(S.sel)?'d='+S.sel.slice(4):''):h;
  $('#toManage').href='manage.html'+(sel?'#'+sel:'');
}
// 管理台在另一个标签页保存数据时提示刷新（地址栏已记录当前位置，刷新后回到原处）
addEventListener('storage',ev=>{if(ev.key===MyNet.KEY)$('#syncToast').style.display='block'});
$('#syncReload').onclick=()=>location.reload();
addEventListener('hashchange',()=>location.reload());

/* ============================================================ 启动 */
resize();camPrep();
initPacks();
// 从地址栏恢复位置（来自管理台的“在星图中查看”或刷新）
{const hp=new URLSearchParams(location.hash.slice(1)),hd=hp.get('d'),hf=hp.get('f'),hs=hp.get('s');
  S.anchor={x:0,y:0};applyUI();
  if(hd&&PACKS[hd]){
    usePack(hd);S.mode='overview';S.range=clamp(+hp.get('r')||1,1,MAXR);
    const sel=hs&&els.has(hs)?hs:null,f=hf&&els.has(hf)&&get(hf).state==='node'?hf:null;
    renderAll();autoCam(true);camPrep();cam.x=cam.tx;cam.y=cam.ty;cam.z=cam.tz*.6;
    if(f)enterGalaxy(rootOf(get(f)).id,f,sel);
    else{S.sel=sel?rootOf(get(sel)).id:null;renderAll()}
  }else{usePack('res');S.mode='universe';warp=1;renderAll()}
}
requestAnimationFrame(frame);
})().catch(console.error);
</script>
</body>
